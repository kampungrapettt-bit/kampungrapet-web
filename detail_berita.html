<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Berita - Dusun Kampung Rapet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: var(--white);
            padding: 4rem 1rem 2rem;
            text-align: center;
        }
        
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .content-section {
            padding: 3rem 1rem;
            background-color: var(--bg-color);
        }
        
        .article-detail {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .article-meta {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .category-badge {
            background-color: #f97316;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .article-thumbnail {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .article-content {
            line-height: 1.8;
            color: var(--text-dark);
            font-size: 1.1rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* Mencegah teks super panjang merusak layout */
        .article-detail h1, 
        .article-detail span, 
        .article-detail p, 
        .article-detail a {
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap; /* For respecting newlines while wrapping */
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .btn-back:hover {
            text-decoration: underline;
        }
        
        /* Skeleton Loading */
        .skeleton {
            background: #e2e8f0;
            border-radius: 4px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
</head>
<body>

    <nav>
        <div class="nav-brand"><img src="image/logo.jpeg" alt="Logo Dusun" style="height: 40px; margin-right: 10px; border-radius: 5px;"> Kampung Rapet</div>
        <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="berita.html" class="active">Berita</a></li>
            <li><a href="galeri.html">Galeri</a></li>
            <li><a href="umkm.html">UMKM</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <main class="content-section" style="padding-top: 6rem;">
        <div class="container">
            <a href="berita.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Berita</a>
            
            <div id="berita-container" class="article-detail">
                <!-- Skeleton Loader -->
                <div class="skeleton" style="height: 40px; width: 80%; margin-bottom: 15px;"></div>
                <div class="skeleton" style="height: 20px; width: 40%; margin-bottom: 30px;"></div>
                <div class="skeleton" style="height: 400px; width: 100%; margin-bottom: 30px; border-radius: 10px;"></div>
                <div class="skeleton" style="height: 20px; width: 100%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 20px; width: 100%; margin-bottom: 10px;"></div>
                <div class="skeleton" style="height: 20px; width: 80%;"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Dusun Kampung Rapet. Dikelola oleh Tim IT Dusun Kampung Rapet.</p>
        <div style="margin-top: 1rem;">
            <a href="admin_login.html" style="color: var(--primary-light); font-size: 0.9rem; text-decoration: underline;"><i class="fa-solid fa-lock"></i> Login Admin</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const beritaId = urlParams.get('id');
            const container = document.getElementById('berita-container');
            
            if (!beritaId) {
                container.innerHTML = '<div style="text-align:center;"><h2>Berita tidak ditemukan.</h2><p>ID Berita tidak valid.</p></div>';
                return;
            }

            try {
                const { data, error } = await supabase.from('berita').select('*').eq('id', beritaId).single();
                
                if (error) throw error;
                if (!data) {
                    container.innerHTML = '<div style="text-align:center;"><h2>Berita tidak ditemukan.</h2><p>Artikel ini mungkin telah dihapus.</p></div>';
                    return;
                }

                // Format Tanggal
                const dateObj = new Date(data.tanggal);
                const dateStr = dateObj.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                
                // Format Penulis
                let authorName = data.author || 'Pengurus Dusun';
                if (authorName.includes('.kampungrapet@gmail.com')) {
                    authorName = authorName.replace('.kampungrapet@gmail.com', '');
                } else if (authorName.includes('@admin.local')) {
                    authorName = authorName.replace('@admin.local', '');
                } else if (authorName.includes('@admin.kampungrapet.com')) {
                    authorName = authorName.replace('@admin.kampungrapet.com', '');
                } else if (authorName.includes('@')) {
                    authorName = authorName.split('@')[0];
                }
                authorName = authorName.charAt(0).toUpperCase() + authorName.slice(1);

                // Format Isi
                const formatIsi = data.isi.replace(/\n/g, '<br>');
                
                // HTML Gambar
                let thumbnailHtml = '';
                if (data.foto_url) {
                    thumbnailHtml = `<img src="${data.foto_url}" class="article-thumbnail" alt="${data.judul}">`;
                }

                // HTML Kategori
                let kategoriHtml = '';
                if (data.kategori) {
                    kategoriHtml = `<span class="category-badge">${data.kategori}</span>`;
                }

                // Render
                container.innerHTML = `
                    <h1 style="font-size: 2.2rem; margin-bottom: 1rem; color: var(--text-dark); line-height: 1.3;">${data.judul}</h1>
                    <div class="article-meta">
                        ${kategoriHtml}
                        <span><i class="fa-regular fa-calendar"></i> ${dateStr}</span>
                        <span><i class="fa-solid fa-pen-nib"></i> Ditulis oleh: ${authorName}</span>
                    </div>
                    ${thumbnailHtml}
                    <div class="article-content">
                        ${formatIsi}
                    </div>
                `;
                
                // Update Title Web
                document.title = `${data.judul} - Dusun Kampung Rapet`;

            } catch (err) {
                console.error('Error fetching berita:', err.message);
                container.innerHTML = '<div style="text-align:center;"><h2>Terjadi Kesalahan.</h2><p>Gagal memuat artikel.</p></div>';
            }
        });
    </script>
</body>
</html>
