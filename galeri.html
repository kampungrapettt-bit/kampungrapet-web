<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Dusun Kampungrapet</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .content-section {
            padding: 8rem 5% 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            aspect-ratio: 4/3;
            background-color: #ddd; /* placeholder background */
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }
        .download-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.3s, background 0.3s, transform 0.2s;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .download-btn:hover {
            background: white;
            color: #5f9ecf;
            transform: scale(1.1);
        }
        .gallery-item:hover .download-btn {
            opacity: 1;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
</head>
<body>

    <nav>
        <div class="nav-brand"><img src="image/logo.jpeg" alt="Logo Dusun" style="height: 40px; margin-right: 10px; border-radius: 5px;"> Kampungrapet</div>
        <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="berita.html">Berita</a></li>
            <li><a href="galeri.html" class="active">Galeri</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <main class="content-section">
        <h1 style="text-align: center; font-size: 3rem; margin-bottom: 2rem;">Galeri Foto</h1>
        
        <div id="galeri-container" class="gallery-grid">
            <p style="text-align: center; grid-column: 1 / -1;">Memuat galeri...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Dusun Kampungrapet.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('galeri-container');
            
            try {
                const { data, error } = await supabase.from('galeri').select('*').order('created_at', { ascending: false });
                
                if (error) throw error;
                
                container.innerHTML = '';
                
                if (data && data.length > 0) {
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'gallery-item';
                        
                        const captionHtml = item.judul ? `<div class="gallery-caption">${item.judul}</div>` : '';
                        
                        div.innerHTML = `
                            <a href="${item.foto_url}" class="download-btn" download="Galeri_Kampungrapet" title="Download Gambar" target="_blank">
                                <i class="fa-solid fa-download"></i>
                            </a>
                            <img src="${item.foto_url}" alt="${item.judul}">
                            ${captionHtml}
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Belum ada foto di galeri.</p>';
                    container.classList.remove('gallery-grid');
                }
            } catch (error) {
                console.error("Error mengambil data galeri:", error.message);
                container.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">Gagal memuat galeri dari server.</p>';
                container.classList.remove('gallery-grid');
            }
        });
    </script>
</body>
</html>
