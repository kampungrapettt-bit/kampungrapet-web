<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Dusun Kampung Rapet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <style>
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Search Bar */
        .search-container {
            max-width: 600px;
            margin: 0 auto 2rem auto;
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex-grow: 1;
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: var(--primary);
        }

        /* Horizontal Scroll Chips */
        .chip-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 2rem;
            scrollbar-width: none; /* Firefox */
        }
        .chip-container::-webkit-scrollbar { 
            display: none; /* Safari and Chrome */
        }
        .chip {
            padding: 8px 20px;
            border-radius: 25px;
            background: white;
            border: 1px solid #e2e8f0;
            color: #334155;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .chip:hover {
            border-color: var(--primary-color, #5f9ecf);
            color: var(--primary-color, #5f9ecf);
        }
        .chip.active {
            background: var(--primary-color, #5f9ecf);
            color: white;
            border-color: var(--primary-color, #5f9ecf);
        }

        /* Album Grid */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .album-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid var(--glass-border);
        }
        .album-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .album-preview {
            height: 200px;
            position: relative;
            background: #f1f5f9;
        }
        
        .album-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Multiple stacked images effect */
        .album-preview .img-back {
            transform: scale(0.9) translateY(-10px);
            opacity: 0.6;
            z-index: 1;
        }
        .album-preview .img-mid {
            transform: scale(0.95) translateY(-5px);
            opacity: 0.8;
            z-index: 2;
        }
        .album-preview .img-front {
            z-index: 3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .album-info {
            padding: 1.5rem;
        }
        .album-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }
        .album-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* Photos Grid (Inside Album) */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .photo-item:hover img {
            transform: scale(1.1);
        }
        .photo-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            padding: 20px 10px 10px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        #view-album {
            display: none;
        }
        .btn-back-album {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 600;
        }
        .btn-back-album:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
</head>
<body>

    <nav>
        <div class="nav-brand"><img src="image/logo.jpeg" alt="Logo Dusun" style="height: 40px; margin-right: 10px; border-radius: 5px;"> Kampung Rapet</div>
        <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="berita.html">Berita</a></li>
            <li><a href="galeri.html" class="active">Galeri</a></li>
            <li><a href="umkm.html">UMKM</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
        <div class="mobile-menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('active')">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>

    <main class="content-section" style="padding-top: 6rem;">
        
        <!-- List Albums View -->
        <div id="view-albums" class="container">
            <div class="page-header">
                <h1 style="font-size: 3rem; margin-bottom: 1rem;">Galeri Dusun</h1>
                <p style="color: var(--text-light);">Jelajahi momen, kegiatan, dan pesona alam Dusun Kampung Rapet.</p>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari nama album atau kategori..." onkeyup="filterAlbums()">
                <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <!-- Chips -->
            <div class="chip-container" id="chip-container">
                <button class="chip active" onclick="setFilter('all')">Semua</button>
                <!-- Kategori dimuat dinamis -->
            </div>

            <!-- Albums -->
            <div id="album-grid" class="album-grid">
                <p style="text-align: center; grid-column: 1/-1;">Memuat galeri...</p>
            </div>
        </div>

        <!-- Single Album View -->
        <div id="view-album" class="container">
            <div class="btn-back-album" onclick="closeAlbum()"><i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Album</div>
            <h1 id="album-title-display" style="font-size: 2rem; margin-bottom: 2rem;">Nama Album</h1>
            <div id="photo-grid" class="photo-grid"></div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Dusun Kampung Rapet. Dikelola oleh Tim IT Dusun Kampung Rapet.</p>
        <div style="margin-top: 1rem;">
            <a href="admin_login.html" style="color: var(--primary-light); font-size: 0.9rem; text-decoration: underline;"><i class="fa-solid fa-lock"></i> Login Admin</a>
        </div>
    </footer>

    <script>
        let allPhotos = [];
        let allAlbums = []; // { id, name, photos: [] }
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadData();
        });

        async function loadData() {
            try {
                // Fetch categories
                const { data: cats, error: errCat } = await supabase.from('kategori_galeri').select('*');
                if (errCat) throw errCat;

                // Fetch photos
                const { data: photos, error: errPhoto } = await supabase.from('galeri').select('*').order('created_at', { ascending: false });
                if (errPhoto) throw errPhoto;

                allPhotos = photos || [];
                
                // Group into albums
                let uncategorized = { id: 'uncategorized', name: 'Lainnya', photos: [] };
                let albumMap = {};
                
                (cats || []).forEach(c => {
                    albumMap[c.id] = { id: c.id, name: c.nama_kategori, photos: [] };
                });

                allPhotos.forEach(p => {
                    if (p.kategori_id && albumMap[p.kategori_id]) {
                        albumMap[p.kategori_id].photos.push(p);
                    } else {
                        uncategorized.photos.push(p);
                    }
                });

                allAlbums = Object.values(albumMap).filter(a => a.photos.length > 0);
                if (uncategorized.photos.length > 0) {
                    allAlbums.push(uncategorized);
                }

                renderChips(cats || []);
                renderAlbums(allAlbums);

            } catch (error) {
                console.error("Gagal memuat:", error);
                document.getElementById('album-grid').innerHTML = '<p style="text-align:center; color:red;">Gagal memuat data.</p>';
            }
        }

        function renderChips(categories) {
            const container = document.getElementById('chip-container');
            container.innerHTML = '<button class="chip active" onclick="setFilter(\'all\', this)">Semua</button>';
            categories.forEach(c => {
                container.innerHTML += `<button class="chip" onclick="setFilter('${c.id}', this)">${c.nama_kategori}</button>`;
            });
        }

        function setFilter(id, btnElement) {
            currentFilter = id;
            document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            filterAlbums();
        }

        function filterAlbums() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allAlbums.filter(a => {
                const matchSearch = a.name.toLowerCase().includes(query);
                const matchCategory = currentFilter === 'all' || a.id === currentFilter;
                return matchSearch && matchCategory;
            });
            
            renderAlbums(filtered);
        }

        function renderAlbums(albums) {
            const container = document.getElementById('album-grid');
            container.innerHTML = '';

            if(albums.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Album tidak ditemukan.</p>';
                return;
            }

            albums.forEach(album => {
                const photoCount = album.photos.length;
                // Get up to 3 photos for stack preview
                const previewPhotos = album.photos.slice(0, 3);
                
                let previewHtml = '';
                if(previewPhotos.length > 0) {
                    previewHtml += `<img src="${previewPhotos[0].foto_url}" class="img-front">`;
                } else {
                    previewHtml += `<div class="img-front" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#e2e8f0;"><i class="fa-solid fa-image fa-2x"></i></div>`;
                }
                if(previewPhotos.length > 1) previewHtml += `<img src="${previewPhotos[1].foto_url}" class="img-mid">`;
                if(previewPhotos.length > 2) previewHtml += `<img src="${previewPhotos[2].foto_url}" class="img-back">`;

                // Try to get year from newest photo
                let year = '2026';
                if(album.photos.length > 0 && album.photos[0].created_at) {
                    year = new Date(album.photos[0].created_at).getFullYear();
                }

                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => openAlbum(album.id);
                card.innerHTML = `
                    <div class="album-preview">
                        ${previewHtml}
                    </div>
                    <div class="album-info">
                        <div class="album-title">${album.name}</div>
                        <div class="album-meta">
                            <span><i class="fa-solid fa-images"></i> ${photoCount} Foto</span>
                            <span><i class="fa-regular fa-calendar"></i> ${year}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openAlbum(albumId) {
            const album = allAlbums.find(a => a.id === albumId);
            if(!album) return;

            document.getElementById('view-albums').style.display = 'none';
            document.getElementById('view-album').style.display = 'block';
            document.getElementById('album-title-display').innerText = album.name;

            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            
            album.photos.forEach(p => {
                const date = p.created_at ? new Date(p.created_at).toLocaleDateString('id-ID') : '';
                grid.innerHTML += `
                    <div class="photo-item">
                        <img src="${p.foto_url}" alt="${p.judul || 'Foto'}">
                        <div class="photo-overlay">
                            <div style="font-weight:600; margin-bottom:5px;">${p.judul || 'Tanpa Judul'}</div>
                            ${date ? `<div style="font-size:0.75rem;"><i class="fa-regular fa-calendar"></i> ${date}</div>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function closeAlbum() {
            document.getElementById('view-albums').style.display = 'block';
            document.getElementById('view-album').style.display = 'none';
        }
    </script>
</body>
</html>
