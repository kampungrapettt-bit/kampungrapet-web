<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Menu - Admin Kampungrapet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #5f9ecf;
            --primary-dark: #4b80a8;
            --bg-color: #f1f5f9;
            --text-dark: #334155;
            --white: #ffffff;
            --border: #e2e8f0;
        }
        * {
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif;
        }
        body {
            background-color: var(--bg-color); color: var(--text-dark);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .topbar {
            background-color: var(--white); padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .content-area {
            padding: 3rem 5%; flex-grow: 1; max-width: 1000px; margin: 0 auto; width: 100%;
        }
        .welcome-text {
            text-align: center; margin-bottom: 3rem;
        }
        .welcome-text h1 {
            color: #0f172a; font-size: 2rem; margin-bottom: 0.5rem;
        }
        .welcome-text p {
            color: #64748b; font-size: 1.1rem;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .menu-card {
            background-color: var(--white);
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            border: 2px solid transparent;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }
        .menu-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            transition: transform 0.3s ease;
        }
        .menu-card:hover .menu-icon {
            transform: scale(1.1);
            color: var(--primary-dark);
        }
        .menu-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .logout-btn {
            display: inline-block;
            margin-top: 3rem;
            padding: 0.8rem 1.5rem;
            background-color: #fef2f2;
            color: #ef4444;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background-color: #fee2e2;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
</head>
<body>

    <header class="topbar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="image/logo.jpeg" alt="Logo Dusun" style="height: 30px; border-radius: 5px;">
            <strong>Admin Dusun</strong>
        </div>
        <a href="index.html" target="_blank" style="color: var(--primary); text-decoration: none;">Lihat Website <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </header>

    <main class="content-area">
        <div class="welcome-text">
            <h1>Selamat Datang, Admin</h1>
            <p>Pilih menu di bawah untuk mengelola konten website Kampungrapet.</p>
        </div>

        <div class="menu-grid">
            <a href="admin_berita.html" class="menu-card">
                <i class="fa-solid fa-newspaper menu-icon"></i>
                <div class="menu-title">Tulis Berita</div>
            </a>
            
            <a href="admin_galeri.html" class="menu-card">
                <i class="fa-solid fa-images menu-icon"></i>
                <div class="menu-title">Kelola Galeri</div>
            </a>
            
            <a href="admin_demografi.html" class="menu-card">
                <i class="fa-solid fa-chart-pie menu-icon"></i>
                <div class="menu-title">Data Demografi</div>
            </a>
            
            <a href="admin_umkm.html" class="menu-card">
                <i class="fa-solid fa-store menu-icon"></i>
                <div class="menu-title">Data UMKM</div>
            </a>
            
            <a href="admin_dayatarik.html" class="menu-card">
                <i class="fa-solid fa-map-location-dot menu-icon"></i>
                <div class="menu-title">Kelola Daya Tarik</div>
            </a>
            
            <a href="admin_lembaga.html" class="menu-card">
                <i class="fa-solid fa-sitemap menu-icon"></i>
                <div class="menu-title">Kelola Lembaga</div>
            </a>
        </div>
        
        <div style="text-align: center;">
            <button onclick="logoutAdmin()" class="logout-btn" style="border: none; cursor: pointer; font-size: 1rem;"><i class="fa-solid fa-right-from-bracket"></i> Keluar dari Sistem</button>
        </div>
    </main>

    <script>
        // Perlindungan Halaman (Auth Guard)
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'admin_login.html';
            }
        });

        // Logika Logout
        async function logoutAdmin() {
            if(confirm('Yakin ingin keluar dari sistem?')) {
                await supabase.auth.signOut();
                window.location.href = 'admin_login.html';
            }
        }
    </script>
</body>
</html>
