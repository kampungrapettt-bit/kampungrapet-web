<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita - Dusun Kampung Rapet</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .content-section {
            padding: 8rem 5% 4rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .news-article {
            background: var(--surface-color);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .news-article:hover {
            border-left: 5px solid var(--primary-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .news-article h2 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }
        .news-meta {
            font-size: 0.95rem;
            color: #475569;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .news-article p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #334155;
        }
        /* Tombol Kembali ke Atas */
        #scrollTopBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            font-size: 1.2rem;
            border: none;
            outline: none;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
            width: 55px;
            height: 55px;
        }
        #scrollTopBtn:hover {
            background-color: var(--primary-dark);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
</head>
<body>

    <nav>
        <div class="nav-brand"><img src="image/logo.jpeg" alt="Logo Dusun" style="height: 40px; margin-right: 10px; border-radius: 5px;"> Kampung Rapet</div>
        <ul class="nav-links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="berita.html" class="active">Berita</a></li>
            <li><a href="galeri.html">Galeri</a></li>
            <li><a href="umkm.html">UMKM</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <main class="content-section">
        <h1 style="text-align: center; font-size: 3rem; margin-bottom: 2rem;">Berita & Kegiatan</h1>
        
        <div id="berita-container">
            <p style="text-align: center;">Memuat berita...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Dusun Kampung Rapet. Dikelola oleh Karang Taruna dan Perangkat Dusun.</p>
        <div style="margin-top: 1rem;">
            <a href="admin_login.html" style="color: var(--primary-light); font-size: 0.9rem; text-decoration: underline;"><i class="fa-solid fa-lock"></i> Login Admin</a>
        </div>
    </footer>

    <button onclick="scrollToTop()" id="scrollTopBtn" title="Kembali ke Atas">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        // Ambil berita dari Supabase dan tampilkan ke halaman
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('berita-container');
            
            try {
                const { data, error } = await supabase.from('berita').select('*').order('tanggal', { ascending: false });
                
                if (error) throw error;
                
                container.innerHTML = ''; // Bersihkan tulisan loading
                
                if (data && data.length > 0) {
                    data.forEach(berita => {
                        // Format tanggal
                        const dateObj = new Date(berita.tanggal);
                        const dateStr = dateObj.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                        
                        const article = document.createElement('article');
                        article.className = 'news-article';
                        
                        let thumbnailHtml = '';
                        if (berita.foto_url) {
                            thumbnailHtml = `<img src="${berita.foto_url}" style="width:100%; max-height:400px; object-fit:cover; border-radius:10px; margin-bottom:1.5rem;" alt="${berita.judul}">`;
                        }

                        // Buat agar isi teks mendukung enter (baris baru)
                        const formatIsi = berita.isi.replace(/\n/g, '<br>');

                        article.innerHTML = `
                            ${thumbnailHtml}
                            <h2>${berita.judul}</h2>
                            <div class="news-meta"><i class="fa-regular fa-calendar"></i> ${dateStr} | Diterbitkan oleh: ${berita.author || 'Pengurus Kampung Rapet'}</div>
                            <p style="white-space: pre-line;">${formatIsi}</p>
                        `;
                        container.appendChild(article);
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; font-size: 1.1rem;">Belum ada berita yang diterbitkan saat ini.</p>';
                }
            } catch (error) {
                console.error("Error mengambil data berita:", error.message);
                container.innerHTML = '<p style="text-align: center; color: red;">Gagal memuat berita dari server.</p>';
            }
        });

        // Fitur Scroll to Top
        const scrollBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollBtn.style.display = "block";
            } else {
                scrollBtn.style.display = "none";
            }
        };
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
